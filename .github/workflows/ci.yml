name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 gives the lint step the base branch history it needs to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run

      - run: npm run build
        env:
          VITE_BACKEND_URL: https://api.example.invalid

      # Lint only the lines this PR adds or changes. The main branch has pre-existing
      # ESLint problems, so linting whole repo (or whole touched files) would fail PRs
      # that never introduced them. Warnings are reported but do not fail the step.
      # Pushes to main skip this step.
      - name: Lint changed lines
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node .github/scripts/lint-changed-lines.mjs "${{ github.base_ref }}"
